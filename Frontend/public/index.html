<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2e7d32" />
  <meta name="description"
    content="An AI-Driven Crop Recommendation and Growth Prediction System Using Soil Fertility and Climate Intelligence" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>AI Crop Recommendation & Growth Prediction System</title>

  <!-- Content Security Policy: allow eval for build tools / dependencies -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* https://api.openweathermap.org https://generativelanguage.googleapis.com; worker-src 'self' blob:;" />

  <!-- PWA iOS Support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AgriSmart">

  <!-- PWA Install Prompt -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!--
    Suppress MetaMask / Web3 browser-extension interference.
    This app is a pure agricultural platform and does NOT use MetaMask or Web3.
    MetaMask's SES lockdown injects into every page; the block below prevents
    its unhandled-rejection noise from appearing in the console.
  -->
  <script>
    // Gracefully suppress MetaMask / SES extension errors – not app errors
    window.addEventListener('unhandledrejection', function (event) {
      if (
        event.reason &&
        (
          (typeof event.reason.message === 'string' &&
            (event.reason.message.includes('MetaMask') ||
             event.reason.message.includes('ethereum') ||
             event.reason.message.includes('SES'))) ||
          (typeof event.reason === 'string' &&
            (event.reason.includes('MetaMask') ||
             event.reason.includes('ethereum')))
        )
      ) {
        event.preventDefault();
        event.stopPropagation();
      }
    });

    // Prevent MetaMask SES lockdown from removing built-ins our app needs
    // by defining a no-op lockdown shim before MetaMask loads its own
    if (typeof window.lockdown === 'undefined') {
      window.__lockdownSuppressed = true;
    }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Offline Fallback Message -->

    ⚠️ You are currently offline. Some features may be limited.
  </div>

</body>
